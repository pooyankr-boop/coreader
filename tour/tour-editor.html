<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تنظیم هایلایت‌ها — زیرزمین</title>
<style>
:root{--gold:#d4af37;--bg:#0e0b07;--panel:#1d1710;--line:#3a2e1e}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:#e8dcc8;font-family:Vazirmatn,Tahoma,sans-serif}
#app{display:flex;height:100vh}
#sb{width:230px;flex:0 0 auto;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:10px}
#sb h3{color:var(--gold);font-size:.85rem;margin:0 0 8px}
.roomBtn{display:block;width:100%;background:none;border:1px solid transparent;color:#c8b898;padding:7px 10px;margin:2px 0;border-radius:5px;cursor:pointer;font:inherit;font-size:.82rem;text-align:right;transition:.15s}
.roomBtn:hover{border-color:var(--gold);background:#241c13}
.roomBtn.on{border-color:var(--gold);background:#2a2010;color:var(--gold)}
.roomBtn small{display:block;opacity:.6;font-size:.7rem}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;background:#000}
#topbar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
#topbar button{background:#2b2014;color:#f0e2cc;border:1px solid var(--line);padding:5px 12px;border-radius:5px;cursor:pointer;font:inherit;font-size:.8rem}
#topbar button:hover{border-color:var(--gold);color:var(--gold)}
#topbar button.on{background:var(--gold);color:#14100c}
#stage{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#000}
#imgBox{position:relative;display:inline-block;line-height:0;max-width:100%;max-height:100%}
#roomImg{max-width:100%;max-height:100vh;width:auto;height:auto;object-fit:contain;cursor:default}
.hs-edit{position:absolute;width:36px;height:36px;transform:translate(-50%,-50%);border-radius:50%;cursor:grab;z-index:10;display:grid;place-items:center;transition:transform .15s,box-shadow .15s;background:transparent}
.hs-edit:hover{transform:translate(-50%,-50%) scale(1.2);z-index:20}
.hs-edit:active{cursor:grabbing}
.hs-edit .ring{width:100%;height:100%;border-radius:50%;border:2.5px solid var(--gold);background:rgba(212,175,55,.2);box-shadow:0 0 12px rgba(212,175,55,.5),inset 0 0 6px rgba(255,255,255,.4)}
.hs-edit.nav .ring{border-color:#d4af37;background:rgba(212,175,55,.18)}
.hs-edit.link .ring{border-color:#9333ea;background:rgba(147,51,234,.2);box-shadow:0 0 12px rgba(147,51,234,.5),inset 0 0 6px rgba(220,180,255,.4)}
.hs-edit .lbl{position:absolute;bottom:110%;right:50%;transform:translateX(50%);background:rgba(20,14,8,.92);color:#f3e7cd;padding:3px 8px;border-radius:4px;font-size:.68rem;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .2s;border:1px solid var(--line)}
.hs-edit:hover .lbl{opacity:1}
.hs-edit .coords{position:absolute;top:110%;right:50%;transform:translateX(50%);color:var(--gold);font-size:.65rem;opacity:0;transition:opacity .2s;pointer-events:none;background:rgba(20,14,8,.9);padding:1px 5px;border-radius:3px}
.hs-edit:hover .coords{opacity:1}
#infobar{padding:6px 12px;background:var(--panel);border-top:1px solid var(--line);font-size:.75rem;color:#a89;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:99;background:rgba(24,18,10,.95);border:1px solid var(--gold);color:#f3e7cd;padding:6px 16px;border-radius:8px;font-size:.85rem;display:none}
.legend{display:flex;gap:12px;align-items:center;font-size:.7rem;color:#a89}
.legend span{display:flex;align-items:center;gap:3px}
.legend .dot{width:10px;height:10px;border-radius:50%;display:inline-block}
</style>
</head>

var cur=null, aspect='desktop';
var saved={};
try{saved=JSON.parse(localStorage.getItem(LS_KEY)||'{}')}catch(e){}

var img=document.getElementById('roomImg'),
    stage=document.getElementById('stage'),
    imgBox=document.getElementById('imgBox'),
    roomTitle=document.getElementById('roomTitle'),
    hsCount=document.getElementById('hsCount');

function $(id){return document.getElementById(id)}
function toast(t){var el=$('toast');el.textContent=t;el.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(function(){el.style.display='none'},2500)}
function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

function imgSrc(r){
  if(aspect==='mobile') return r.img.replace('.jpg','_mobile.jpg');
  return r.img;
}
function setAspect(a){
  aspect=a;
  $('vDesktop').classList.toggle('on',a==='desktop');
  $('vMobile').classList.toggle('on',a==='mobile');
  if(cur) renderRoom();
}

function objKey(o){return o.slug||o.nav||o.href;}
function hotspotsOf(r){
  return r.objs.map(function(o,i){
    var cls=o.href?'link':(o.nav?'nav':'');
    return {key:r.id+'/'+objKey(o), i:i, label:o.t, cls:cls, x:o.x, y:o.y};
  });
}

function renderRoom(){
  img.src=imgSrc(cur);
  img.onload=function(){drawHotspots()};
  if(img.complete) drawHotspots();
  roomTitle.textContent=cur.name;
}

function toImgPct(ev){
  var r=imgBox.getBoundingClientRect();
  var x=Math.round(((ev.clientX-r.left)/r.width)*1000)/10;
  var y=Math.round(((ev.clientY-r.top)/r.height)*1000)/10;
  x=Math.max(0,Math.min(100,x));
  y=Math.max(0,Math.min(100,y));
  return {x:x,y:y};
}

function drawHotspots(){
  [].forEach.call(stage.querySelectorAll('.hs-edit'),function(n){n.parentNode.removeChild(n)});
  var hs=hotspotsOf(cur);
  hsCount.textContent=hs.length+' هایلایت';
  hs.forEach(function(h){
    var key=h.key+':'+aspect;
    var c=saved[key];
    var x=c?c.x:h.x, y=c?c.y:h.y;
    var d=document.createElement('div');
    d.className='hs-edit'+(h.cls?' '+h.cls:'');
    d.style.left=x+'%'; d.style.top=y+'%';
    d.innerHTML='<div class="ring"></div><span class="lbl">'+esc(h.label)+'</span><span class="coords">'+x.toFixed(1)+', '+y.toFixed(1)+'</span>';
    d.addEventListener('pointerdown',function(e){
      e.preventDefault();e.stopPropagation();
      d.setPointerCapture(e.pointerId);
      function mv(ev){
        var p=toImgPct(ev);
        d.style.left=p.x+'%'; d.style.top=p.y+'%';
        d.querySelector('.coords').textContent=p.x.toFixed(1)+', '+p.y.toFixed(1);
        saved[key]={x:p.x,y:p.y};
      }
      function up(){
        d.onpointermove=null; d.onpointerup=null;
        localStorage.setItem(LS_KEY,JSON.stringify(saved));
        toast('ذخیره شد: '+h.label);
      }
      d.onpointermove=mv; d.onpointerup=up;
    });
    stage.appendChild(d);
  });
}

function exportJSON(){
  var out={};
  ROOMS.forEach(function(r){
    var roomOut={};
    r.objs.forEach(function(o,i){
      var key=r.id+'/'+objKey(o)+':'+aspect;
      if(saved[key]) roomOut[objKey(o)]=saved[key];
    });
    if(Object.keys(roomOut).length) out[r.id]=roomOut;
  });
  var txt=JSON.stringify(out,null,2);
  if(navigator.clipboard) navigator.clipboard.writeText(txt);
  console.log(txt);
  toast('JSON در کلیپ‌بورد و کنسول');
}

function resetAll(){
  if(confirm('مختصات ذخیره‌شده پاک شود؟')){
    saved={};
    localStorage.removeItem(LS_KEY);
    drawHotspots();
    toast('بازگردانی شد');
  }
}

// build room list
(function(){
  var rl=$('roomList');
  ROOMS.forEach(function(r){
    var b=document.createElement('button');
    b.className='roomBtn'; b.dataset.id=r.id;
    b.innerHTML=r.name+'<small>'+r.objs.length+' هایلایت</small>';
    b.onclick=function(){
      cur=r;
      var btns=document.querySelectorAll('.roomBtn[data-id]');
      for(var i=0;i<btns.length;i++) btns[i].classList.toggle('on',btns[i].dataset.id===r.id);
      renderRoom();
    };
    rl.appendChild(b);
  });
  cur=ROOMS[0];
  document.querySelector('.roomBtn[data-id="'+cur.id+'"]').classList.add('on');
  renderRoom();
})();
