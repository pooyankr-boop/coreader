<style>
:root{--gold:#d4af37;--bg:#14100c;--panel:#211a12}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:#e8dcc8;font-family:Vazirmatn,Tahoma,sans-serif}
#stage{position:fixed;inset:0;overflow:hidden;background:#000;touch-action:none}
#imgwrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);line-height:0;will-change:transform}
#roomImg{display:block;max-width:100vw;max-height:100vh;width:auto;height:auto;user-select:none;-webkit-user-drag:none;object-fit:cover}
#tip{position:absolute;transform:translate(-50%,-140%);background:rgba(20,14,8,.94);border:1px solid var(--gold);color:#f3e7cd;padding:5px 12px;border-radius:6px;font-size:13px;line-height:1.6;white-space:nowrap;width:max-content;pointer-events:none;display:none;z-index:5}
.hot{
  position:absolute;width:30px;height:30px;transform:translate(-50%,-50%);
  border-radius:50%;
  background:radial-gradient(circle, rgba(255,235,160,0.95) 0%, rgba(212,175,55,0.85) 45%, rgba(160,110,20,0.4) 75%, transparent 100%);
  border:1.5px solid rgba(255,245,200,0.95);
  box-shadow:0 0 15px rgba(212,175,55,0.9), 0 0 30px rgba(212,175,55,0.4), inset 0 0 6px rgba(255,255,255,0.9);
  cursor:pointer;z-index:4;padding:0;
  transition:transform .2s ease, filter .2s ease;
}
.hot:hover{
  transform:translate(-50%,-50%) scale(1.3);
  filter:brightness(1.3) drop-shadow(0 0 10px #ffea88);
}
.hot::after{
  content:"";position:absolute;inset:7px;border-radius:50%;
  background:#fff;
  box-shadow:0 0 6px #fff, 0 0 12px var(--gold);
}
.hot::before{
  content:"";position:absolute;inset:-8px;border-radius:50%;
  border:1.5px solid rgba(212,175,55,0.8);
  animation:pulseRing 2.2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
}
@keyframes pulseRing{
  0%{transform:scale(0.6);opacity:0.9;border-color:rgba(255,230,130,0.9)}
  60%{opacity:0.4}
  100%{transform:scale(1.9);opacity:0;border-color:rgba(212,175,55,0)}
}
.hot.link{
  background:radial-gradient(circle, rgba(220,180,255,0.95) 0%, rgba(147,51,234,0.85) 45%, rgba(100,20,180,0.4) 75%, transparent 100%);
  border-color:rgba(230,200,255,0.95);
  box-shadow:0 0 15px rgba(147,51,234,0.9), 0 0 30px rgba(147,51,234,0.4), inset 0 0 6px #fff;
}
.hot.link::after{
  background:#fff;
  box-shadow:0 0 6px #fff, 0 0 12px #9333ea;
}
.hot.link::before{
  border-color:rgba(168,85,247,0.8);
}
body.edit .hot{cursor:move}
/* mini control panel */
#mini{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:6px;padding:8px 12px;background:rgba(24,18,10,.92);border:1px solid #4a3a24;border-radius:14px;backdrop-filter:blur(6px);transition:opacity .35s,transform .35s;max-width:96vw;flex-wrap:wrap;justify-content:center}
#mini.hide{opacity:0;transform:translateX(-50%) translateY(14px);pointer-events:none}
#mini button{background:#2b2216;color:#e8dcc8;border:1px solid #4a3a24;height:38px;min-width:38px;padding:0 10px;border-radius:10px;cursor:pointer;font-family:inherit;font-size:16px}
#mini button:hover{border-color:var(--gold);color:var(--gold)}
#mini button.on{background:var(--gold);color:#14100c}
#roomName{font-size:13px;color:var(--gold);padding:0 8px;white-space:nowrap}
#zoomPct{font-size:12px;color:#a99;min-width:38px;text-align:center}
.sep{width:1px;height:24px;background:#4a3a24;margin:0 2px}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:30;background:rgba(24,18,10,.95);border:1px solid var(--gold);color:#f3e7cd;padding:6px 14px;border-radius:8px;font-size:13px;display:none}
</style>

// ————— zoom / pan —————
var z=1,dx=0,dy=0;
function applyT(){wrap.style.transform='translate(calc(-50% + '+dx+'px), calc(-50% + '+dy+'px)) scale('+z+')';zoomPct.textContent=Math.round(z*100)+'%'}
function setZoom(nz){z=Math.max(1,Math.min(4,nz));if(z===1){dx=0;dy=0}applyT()}
document.getElementById('zIn').onclick=function(){setZoom(z*1.25)};
document.getElementById('zOut').onclick=function(){setZoom(z/1.25)};
stage.addEventListener('wheel',function(e){e.preventDefault();setZoom(z*(e.deltaY<0?1.12:1/1.12))},{passive:false});
var panning=false,px=0,py=0;
stage.addEventListener('pointerdown',function(e){
  if(e.target.closest('.hot'))return;
  if(z===1)return;
  panning=true;px=e.clientX;py=e.clientY;stage.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove',function(e){
  if(!panning)return;
  dx+=e.clientX-px;dy+=e.clientY-py;px=e.clientX;py=e.clientY;applyT();
});
stage.addEventListener('pointerup',function(){panning=false});

// ————— cover-fit correction —————
// Hotspot coords are % of the image; img is scaled to cover the viewport,
// so it may be cropped.  fixCover maps image-percents → screen-percents.
function fixCover(hx, hy) {
  if (!img || !img.naturalWidth) return [hx, hy];
  var cw = img.clientWidth, ch = img.clientHeight;
  var nw = img.naturalWidth, nh = img.naturalHeight;
  var sc = Math.max(cw / nw, ch / nh);
  var rw = nw * sc, rh = nh * sc;
  var ox = (cw - rw) / 2, oy = (ch - rh) / 2;
  return [(ox + rw * hx / 100) * 100 / cw, (oy + rh * hy / 100) * 100 / ch];
}

// Reverse: screen-percents → image-percents (for drag editing)
function unCover(px, py) {
  if (!img || !img.naturalWidth) return [px, py];
  var cw = img.clientWidth, ch = img.clientHeight;
  var nw = img.naturalWidth, nh = img.naturalHeight;
  var sc = Math.max(cw / nw, ch / nh);
  var rw = nw * sc, rh = nh * sc;
  var ox = (cw - rw) / 2, oy = (ch - rh) / 2;
  var sx = px * cw / 100, sy = py * ch / 100;
  return [(sx - ox) * 100 / rw, (sy - oy) * 100 / rh];
}

  if(c && c.x>=0 && c.x<=100 && c.y>=0 && c.y<=100) return c;
  var fallback=isMob&&o._x_mobile!=null?{x:o._x_mobile,y:o._y_mobile}:{x:o.x,y:o.y};
  return fallback;
}

// Mobile images are 90° CW rotated versions of desktop.
// Coordinate transform: desktop(x,y) -> mobile(y, 100-x)
function mobCoords(x, y) {
  return [y, 100 - x];
}

function getRoomImg(r){
  var isMob = window.innerWidth <= 768 || (window.innerHeight > window.innerWidth);
  return isMob ? r.img.replace('.jpg', '_mobile.jpg') : r.img;
}

function isMobile(){
  return window.innerWidth <= 768 || (window.innerHeight > window.innerWidth);
}

function render(){
  img.src=getRoomImg(cur);
  img.onload=function(){drawHots()};
  if(img.complete)drawHots();
  roomName.textContent=cur.name+' ('+cur.objs.length+')';
}
window.addEventListener('resize', function(){
  var newSrc = getRoomImg(cur);
  if(img.src.indexOf(newSrc) === -1) {
    img.src = newSrc;
    drawHots();
  }
});

function drawHots(){
  [].forEach.call(wrap.querySelectorAll('.hot'),function(n){n.remove()});
  cur.objs.forEach(function(o){
    var p=pos(cur,o);
    // Apply mobile coordinate transformation if needed
    var px = p.x, py = p.y;
    if(isMobile()){
      // Use explicit mobile coords if available, otherwise transform
      if(o._x_mobile != null && o._y_mobile != null){
        px = o._x_mobile;
        py = o._y_mobile;
      } else {
        var mc = mobCoords(p.x, p.y);
        px = mc[0]; py = mc[1];
      }
    }
    var pc=fixCover(px,py);
    var d=document.createElement('button');
    d.className='hot'+(o.href?' link':''); d.style.left=pc[0]+'%'; d.style.top=pc[1]+'%';
    d.onmouseenter=function(){tip.textContent=o.t;tip.style.display='block';
      tip.style.left=pc[0]+'%';tip.style.top=pc[1]+'%'};
    d.onmouseleave=function(){tip.style.display='none'};
    d.onclick=function(e){
      if(editing)return;
      if(o.href){location.href=o.href;return}
      if(o.nav){selectRoom(o.nav);return}
      if(o.slug){
        // Open the book/viewer directly for this slug
        location.href='../viewer/viewer.html?book='+encodeURIComponent(o.slug);
        return;
      }
      if(e.button===1||e.ctrlKey||e.metaKey||e.shiftKey)
        window.open('../viewer/viewer.html?book='+encodeURIComponent(o.slug));
      else location.href='../viewer/viewer.html?book='+encodeURIComponent(o.slug);
    };
    d.onpointerdown=function(e){
      if(!editing)return;
      e.preventDefault();e.stopPropagation();d.setPointerCapture(e.pointerId);
      function mv(ev){
        var r=wrap.getBoundingClientRect();
        var sx=((ev.clientX-r.left)/r.width)*100;
        var sy=((ev.clientY-r.top)/r.height)*100;
        var u=unCover(sx,sy);
        // Validate before storing
        if(u[0]<0||u[0]>100||u[1]<0||u[1]>100) return;
        var pc=fixCover(u[0],u[1]);
        d.style.left=pc[0]+'%'; d.style.top=pc[1]+'%';
        tip.style.left=pc[0]+'%'; tip.style.top=pc[1]+'%';
        saved[cur.id+'/'+(o.slug||o.nav||o.href)+(isMobile()?':mobile':':desktop')]={x:u[0],y:u[1]};
      }
      function up(){
        d.onpointermove=null; d.onpointerup=null;
        localStorage.setItem(LS_KEY,JSON.stringify(saved));
        showToast('ذخیره شد');
      }
      d.onpointermove=mv; d.onpointerup=up;
    };
    wrap.appendChild(d);
  });
}

function selectRoom(id){
  var i=ROOMS.map(function(r){return r.id}).indexOf(id);
  if(i<0)i=0;
  curIdx=i; cur=ROOMS[i];
  z=1;dx=0;dy=0;applyT();
  render();
}
function step(d){selectRoom(ROOMS[(curIdx+d+ROOMS.length)%ROOMS.length].id)}

document.getElementById('nextBtn').onclick=function(){step(1)};
document.getElementById('prevBtn').onclick=function(){step(-1)};
document.getElementById('homeBtn').onclick=function(){selectRoom('konj')};
function goCatalog(){location.href='../index.html'}
document.getElementById('catBtn').onclick=goCatalog;
document.getElementById('closeBtn').onclick=goCatalog;

// ————— keyboard —————
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowLeft')step(1);           // rtl: left = next
  else if(e.key==='ArrowRight')step(-1);
  else if(e.key==='Escape')goCatalog();
  else if(e.key==='+'||e.key==='=')setZoom(z*1.25);
  else if(e.key==='-')setZoom(z/1.25);
  else if(e.key==='e'||e.key==='E'){editing=!editing;document.body.classList.toggle('edit',editing);showToast(editing?'حالت ویرایش: نقاط را بکشید':'حالت نمایش')}
  else if(e.key==='c'||e.key==='C'){
    var txt=JSON.stringify(saved,null,1);
    if(navigator.clipboard)navigator.clipboard.writeText(txt);
    console.log(txt); showToast('JSON در کلیپ‌بورد/کنسول');
  }
  else if(e.key==='r'||e.key==='R'){
    if(confirm('مختصات ذخیره‌شده پاک شود?')){saved={};localStorage.removeItem(LS_KEY);drawHots();showToast('بازگردانی شد')}
  }
});

// edit tools are keyboard-only: E=جابجایی، C=خروجی JSON، R=بازگردانی
render();applyT();
</script>
</body>
</html>
