<style>
:root{--gold:#d4af37;--bg:#14100c;--panel:#211a12;
  --font-house:'Fedra','Lalezar','Vazirmatn',Tahoma,sans-serif;
  --font-under:'Iran Nastaliq','Noto Nastaliq Urdu','Scheherazade New',serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:#e8dcc8;font-family:var(--font-under,Vazirmatn,Tahoma,sans-serif)}
#stage{position:fixed;inset:0;overflow:hidden;background:#000;touch-action:none}
#imgwrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);line-height:0;will-change:transform}
#roomImg{display:block;max-width:100vw;max-height:100vh;width:auto;height:auto;user-select:none;-webkit-user-drag:none;object-fit:cover}
#tip{position:absolute;transform:translate(-50%,-140%);background:rgba(20,14,8,.94);border:1px solid var(--gold);color:#f3e7cd;padding:6px 14px;border-radius:10px;font-size:14px;line-height:2;white-space:normal;width:max-content;max-width:min(72vw,300px);text-align:center;pointer-events:none;display:none;z-index:5;font-family:var(--font-under,'Noto Nastaliq Urdu',serif)}
.hot{
  position:absolute;width:44px;height:44px;transform:translate(-50%,-50%);
  border-radius:50%;
  background:radial-gradient(circle, rgba(255,235,160,0.95) 0%, rgba(212,175,55,0.85) 45%, rgba(160,110,20,0.4) 75%, transparent 100%);
  border:1.5px solid rgba(255,245,200,0.95);
  box-shadow:0 0 15px rgba(212,175,55,0.9), 0 0 30px rgba(212,175,55,0.4), inset 0 0 6px rgba(255,255,255,0.9);
  cursor:pointer;z-index:4;padding:0;
  transition:transform .2s ease, filter .2s ease;
  touch-action:manipulation;
}
@media (hover:hover) and (pointer:fine){ .hot{width:30px;height:30px} }
.hot:hover{
  transform:translate(-50%,-50%) scale(1.3);
  filter:brightness(1.3) drop-shadow(0 0 10px #ffea88);
}
.hot::after{
  content:"";position:absolute;inset:7px;border-radius:50%;
  background:#fff;
  box-shadow:0 0 6px #fff, 0 0 12px var(--gold);
}
.hot::before{
  content:"";position:absolute;inset:-8px;border-radius:50%;
  border:1.5px solid rgba(212,175,55,0.8);
  animation:pulseRing 2.2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
}
@keyframes pulseRing{
  0%{transform:scale(0.6);opacity:0.9;border-color:rgba(255,230,130,0.9)}
  60%{opacity:0.4}
  100%{transform:scale(1.9);opacity:0;border-color:rgba(212,175,55,0)}
}
.hot.link{
  background:radial-gradient(circle, rgba(220,180,255,0.95) 0%, rgba(147,51,234,0.85) 45%, rgba(100,20,180,0.4) 75%, transparent 100%);
  border-color:rgba(230,200,255,0.95);
  box-shadow:0 0 15px rgba(147,51,234,0.9), 0 0 30px rgba(147,51,234,0.4), inset 0 0 6px #fff;
}
.hot.link::after{
  background:#fff;
  box-shadow:0 0 6px #fff, 0 0 12px #9333ea;
}
.hot.link::before{
  border-color:rgba(168,85,247,0.8);
}
body.edit .hot{cursor:move}
/* mini control panel */
#mini{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:6px;padding:8px 12px;background:rgba(24,18,10,.92);border:1px solid #4a3a24;border-radius:14px;backdrop-filter:blur(6px);transition:opacity .35s,transform .35s;max-width:96vw;flex-wrap:wrap;justify-content:center;font-family:var(--font-house,'Fedra','Lalezar',sans-serif)}
#mini.hide{opacity:0;transform:translateX(-50%) translateY(14px);pointer-events:none}
#mini button{background:#2b2216;color:#e8dcc8;border:1px solid #4a3a24;height:38px;min-width:38px;padding:0 10px;border-radius:10px;cursor:pointer;font-family:inherit;font-size:16px}
#mini button:hover{border-color:var(--gold);color:var(--gold)}
#mini button.on{background:var(--gold);color:#14100c}
#roomName{font-size:15px;color:var(--gold);padding:0 8px;white-space:nowrap;font-family:var(--font-under,'Noto Nastaliq Urdu',serif);line-height:2.2}
#zoomPct{font-size:12px;color:#a99;min-width:38px;text-align:center}
.sep{width:1px;height:24px;background:#4a3a24;margin:0 2px}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:30;background:rgba(24,18,10,.95);border:1px solid var(--gold);color:#f3e7cd;padding:6px 14px;border-radius:8px;font-size:13px;display:none}

/* رصدخانه فرابنفش کیهان و گالری تصاویر آسماننما */
#skyGal{display:none;position:fixed;inset:0;z-index:40;background:rgba(8,6,4,.88);backdrop-filter:blur(8px);align-items:center;justify-content:center;padding:12px;box-sizing:border-box}
#skyGalBox{display:flex;flex-direction:column;width:min(96vw,1080px);height:min(92vh,780px);background:#130e09;border:1px solid var(--gold);border-radius:16px;box-shadow:0 16px 50px rgba(0,0,0,.85);overflow:hidden;position:relative}
.sg-head{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:#20170e;border-bottom:1px solid #4a3a24;gap:12px;flex-wrap:wrap}
.sg-tabs{display:flex;gap:6px;background:#140e08;padding:3px;border-radius:10px;border:1px solid #3d2e1b}
.sg-tab{background:transparent;color:#bcae97;border:0;padding:6px 14px;border-radius:8px;font-size:13px;cursor:pointer;font-family:inherit;transition:all .2s}
.sg-tab.active{background:var(--gold);color:#140e08;font-weight:bold}
.sg-actions{display:flex;align-items:center;gap:8px}
.sg-btn{background:#2a1f13;color:#e8dcc8;border:1px solid #4a3a24;border-radius:8px;padding:5px 12px;font-size:13px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:4px;font-family:inherit;transition:all .2s}
.sg-btn:hover{border-color:var(--gold);color:var(--gold)}
.sg-close{width:32px;height:32px;border-radius:8px;background:#2a1f13;color:#e8dcc8;border:1px solid #4a3a24;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.sg-close:hover{background:#932020;color:#fff;border-color:#ff5555}
.sg-body{flex:1;position:relative;display:flex;flex-direction:column;overflow:hidden;background:#050403}
.sg-view{display:none;width:100%;height:100%;position:relative;flex-direction:column}
.sg-view.active{display:flex}
.sg-stage{flex:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:0;user-select:none;padding:12px}
.sg-img{max-width:96%;max-height:96%;object-fit:contain;transition:transform .18s ease-out;box-shadow:0 0 25px rgba(0,0,0,.7);border-radius:6px}
.sg-nav-arrow{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(20,14,8,.75);border:1px solid #4a3a24;color:#f3e7cd;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:5;transition:all .2s;backdrop-filter:blur(4px)}
.sg-nav-arrow:hover{border-color:var(--gold);color:var(--gold);background:rgba(33,23,14,.9)}
.sg-prev{right:16px}
.sg-next{left:16px}
.sg-info{padding:10px 16px;background:rgba(20,14,8,.94);border-top:1px solid #3d2e1b;display:flex;flex-direction:column;gap:4px}
.sg-title-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sg-title{color:var(--gold);font-size:15px;font-weight:bold}
.sg-meta{color:#a99;font-size:12px}
.sg-desc{color:#ded2be;font-size:13px;line-height:1.6;margin:0}
.sg-toolbar{display:flex;align-items:center;gap:8px;padding:8px 14px;background:#1a130b;border-top:1px solid #382816;overflow-x:auto;flex-wrap:wrap}
.sg-slider-group{display:flex;align-items:center;gap:6px;font-size:12px;color:#c9baa1}
.sg-slider-group input[type=range]{width:80px;accent-color:var(--gold);cursor:pointer}
.sg-frame-wrap{flex:1;width:100%;height:100%;position:relative;display:flex;flex-direction:column}
.sg-frame{flex:1;width:100%;height:100%;border:0;background:#0b0805}
.sg-frame-hint{padding:8px 14px;background:#181109;border-top:1px solid #3d2e1b;color:#a99;font-size:12px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
</style>

function migrateSaved(){
  var norm=function(s){return String(s).replace(/[\u200c\u200d\u0640\u064b-\u065f]/g,'').replace(/\u06c0/g,'\u0647').replace(/\u064a/g,'\u06cc').replace(/\s+/g,' ').trim();};

  SLUG_MOVES.forEach(function(m){
    var room=ROOMS.filter(function(r){return r.id===m[0];})[0]; if(!room) return;
    var target=room.objs.filter(function(o){return o.slug===m[3];})[0]; if(!target) return;
    Object.keys(saved).slice().forEach(function(k){
      var mm=k.match(/^([^\/]+)\/([^|]+)\|(.*):(desktop|mobile)$/);
      if(!mm||mm[1]!==m[0]||mm[2]!==m[1]||norm(mm[3])!==norm(m[2])) return;
      var nk=m[0]+'/'+m[3]+'|'+target.t+':'+mm[4];
      if(!saved[nk]){ saved[nk]=saved[k]; moved++; }
      delete saved[k];
    });
  });
  if(moved){ try{localStorage.setItem(LS_KEY,JSON.stringify(saved));}catch(e){} }
  return moved;
}

// ————— cover-fit correction —————
// Hotspot coords are % of the image; img is scaled to cover the viewport,
// so it may be cropped.  fixCover maps image-percents → screen-percents.
function fixCover(hx, hy) {
  if (!img || !img.naturalWidth) return [hx, hy];
  var cw = img.clientWidth, ch = img.clientHeight;
  var nw = img.naturalWidth, nh = img.naturalHeight;
  var sc = Math.max(cw / nw, ch / nh);
  var rw = nw * sc, rh = nh * sc;
  var ox = (cw - rw) / 2, oy = (ch - rh) / 2;
  return [(ox + rw * hx / 100) * 100 / cw, (oy + rh * hy / 100) * 100 / ch];
}

// Reverse: screen-percents → image-percents (for drag editing)
function unCover(px, py) {
  if (!img || !img.naturalWidth) return [px, py];
  var cw = img.clientWidth, ch = img.clientHeight;
  var nw = img.naturalWidth, nh = img.naturalHeight;
  var sc = Math.max(cw / nw, ch / nh);
  var rw = nw * sc, rh = nh * sc;
  var ox = (cw - rw) / 2, oy = (ch - rh) / 2;
  var sx = px * cw / 100, sy = py * ch / 100;
  return [(sx - ox) * 100 / rw, (sy - oy) * 100 / rh];
}

function posKey(r,o,idx){
  return r.id+'/'+(o.slug||o.nav||o.href)+'|'+(o.t||idx);
}
function pos(r,o,idx){
  var isMob=isMobile();
  var k=posKey(r,o,idx)+(isMob?':mobile':':desktop');
  var c=saved[k];
  // سازگاری با کلیدهای قدیمی بدون عنوان
  if(!c){ var kOld=r.id+'/'+(o.slug||o.nav||o.href)+(isMob?':mobile':':desktop'); c=saved[kOld]; }
  if(c && c.x>=0 && c.x<=100 && c.y>=0 && c.y<=100) return c;
  var fallback=isMob&&o._x_mobile!=null?{x:o._x_mobile,y:o._y_mobile}:{x:o.x,y:o.y};
  return fallback;
}

// Mobile images are 90° CW rotated versions of desktop.
// Coordinate transform: desktop(x,y) -> mobile(y, 100-x)
function mobCoords(x, y) {
  return [y, 100 - x];
}

function isCoarsePointer(){ try { return window.matchMedia && matchMedia('(pointer: coarse)').matches; } catch(e){ return false; } }
function getRoomImg(r){
  var mob = isMobile();
  var src = mob ? r.img.replace('.jpg', '_mobile.jpg') : r.img;
  return src;
}

function isMobile(){
  // دسکتاپ باریک عمودی نباید نسخه موبایل بگیرد؛ فقط عرض کم + اشاره لمسی
  if(window.innerWidth <= 768 && (isCoarsePointer() || window.innerHeight > window.innerWidth)) return true;
  if(window.innerWidth <= 480 && isCoarsePointer()) return true;
  // تبلت عمودی لمسی
  if(isCoarsePointer() && window.innerWidth <= 820 && window.innerHeight > window.innerWidth) return true;
  return false;
}

function drawHots(){
  [].forEach.call(wrap.querySelectorAll('.hot'),function(n){n.remove()});
  cur.objs.forEach(function(o, idx){
    var p=pos(cur,o,idx);
    // اگر مختصات موبایل صریح نیست، از همان دسکتاپ استفاده کن (نه چرخش حدسی)
    var px = p.x, py = p.y;
    if(isMobile()){
      if(o._x_mobile != null && o._y_mobile != null){
        var k2 = cur.id+'/'+(o.slug||o.nav||o.href)+'|'+(o.t||idx)+':mobile';
        var c2 = saved[k2];
        if(c2 && c2.x>=0 && c2.x<=100 && c2.y>=0 && c2.y<=100){ px=c2.x; py=c2.y; }
        else { px = o._x_mobile; py = o._y_mobile; }
      } else {
        px = p.x; py = p.y;
      }
    }
    var pc=fixCover(px,py);
    var d=document.createElement('button');
    d.className='hot'+(o.href?' link':''); d.style.left=pc[0]+'%'; d.style.top=pc[1]+'%';
    d.onmouseenter=function(){tip.textContent=o.t;tip.style.display='block';
      tip.style.left=pc[0]+'%';tip.style.top=pc[1]+'%'};
    d.onmouseleave=function(){tip.style.display='none'};
    // لمسی: نمایش لحظه‌ای نام اثر
    d.addEventListener('touchstart',function(){ tip.textContent=o.t; tip.style.display='block'; tip.style.left=pc[0]+'%'; tip.style.top=pc[1]+'%'; clearTimeout(d._tt); d._tt=setTimeout(function(){tip.style.display='none'},1600); },{passive:true});
    d.onclick=function(e){
      if(editing)return;
      if(o.embed){openSkyGallery(o.embed,o.t);return}
      if(o.href){location.href=o.href;return}
      if(o.nav){selectRoom(o.nav);return}
      if(o.slug){
        // Open the book/viewer directly for this slug
        location.href='../viewer/viewer.html?book='+encodeURIComponent(o.slug);
        return;
      }
      if(e.button===1||e.ctrlKey||e.metaKey||e.shiftKey)
        window.open('../viewer/viewer.html?book='+encodeURIComponent(o.slug));
      else location.href='../viewer/viewer.html?book='+encodeURIComponent(o.slug);
    };
    d.onpointerdown=function(e){
      if(!editing)return;
      e.preventDefault();e.stopPropagation();d.setPointerCapture(e.pointerId);
      function mv(ev){
        var r=wrap.getBoundingClientRect();
        var sx=((ev.clientX-r.left)/r.width)*100;
        var sy=((ev.clientY-r.top)/r.height)*100;
        var u=unCover(sx,sy);
        // Validate before storing
        if(u[0]<0||u[0]>100||u[1]<0||u[1]>100) return;
        var pc=fixCover(u[0],u[1]);
        d.style.left=pc[0]+'%'; d.style.top=pc[1]+'%';
        tip.style.left=pc[0]+'%'; tip.style.top=pc[1]+'%';
        saved[posKey(cur,o,idx)+(isMobile()?':mobile':':desktop')]={x:u[0],y:u[1]};
      }
      function up(){
        d.onpointermove=null; d.onpointerup=null;
        localStorage.setItem(LS_KEY,JSON.stringify(saved));
        showToast('ذخیره شد');
      }
      d.onpointermove=mv; d.onpointerup=up;
    };
    wrap.appendChild(d);
  });
}

function galFilter(){

function galShow(){

  var metaEl = document.getElementById('sgImgMeta');
  var descEl = document.getElementById('sgImgDesc');
  if(!GAL.list.length){

    if(descEl) descEl.textContent = 'لطفاً اطمینان حاصل کنید فایل‌های پوشهٔ tour/sky-gallery/ موجود هستند.';
    return;
  }
  var it = GAL.list[GAL.i];
  if(img){
    if(img.getAttribute('src') !== it.src) img.src = it.src;
    img.style.filter = galFilter();
    img.style.transform = 'rotate('+GAL.rot+'deg) scale('+(GAL.fx*GAL.z)+','+(GAL.fy*GAL.z)+')';
  }
  if(titleEl) titleEl.textContent = it.title || '';
  if(metaEl) metaEl.textContent = (it.source ? it.source + ' • ' : '') + 'تصویر ' + (GAL.i + 1) + ' از ' + GAL.list.length;
  if(descEl) descEl.textContent = it.desc || '';

  // به‌روزرسانی مقادیر اسلایدرها
  var sb = document.getElementById('sgSliderB'); if(sb) sb.value = GAL.b;
  var sc = document.getElementById('sgSliderC'); if(sc) sc.value = GAL.c;
  var ss = document.getElementById('sgSliderS'); if(ss) ss.value = GAL.s;
  var sh = document.getElementById('sgSliderH'); if(sh) sh.value = GAL.h;
  var sg = document.getElementById('sgSliderG'); if(sg) sg.value = GAL.g;
}

function galPreset(type){
  GAL.b = 100; GAL.c = 100; GAL.s = 100; GAL.h = 0; GAL.g = 0; GAL.inv = 0;
  if(type === 'uv'){ GAL.h = 190; GAL.s = 220; GAL.c = 130; GAL.b = 105; }
  else if(type === 'gray'){ GAL.g = 100; GAL.c = 115; }
  else if(type === 'inv'){ GAL.inv = 100; GAL.c = 110; }
  galShow();
}

function setSkyGalTab(tab){
  GAL.tab = tab;
  var tabGal = document.getElementById('sgTabGallery');
  var tabOn = document.getElementById('sgTabOnline');
  var viewGal = document.getElementById('sgViewGallery');
  var viewOn = document.getElementById('sgViewOnline');
  var frame = document.getElementById('sgFrame');

  if(tab === 'gallery'){
    if(tabGal) tabGal.classList.add('active');
    if(tabOn) tabOn.classList.remove('active');
    if(viewGal) viewGal.classList.add('active');
    if(viewOn) viewOn.classList.remove('active');
  } else {
    if(tabGal) tabGal.classList.remove('active');
    if(tabOn) tabOn.classList.add('active');
    if(viewGal) viewGal.classList.remove('active');
    if(viewOn) viewOn.classList.add('active');
    if(frame && (!frame.src || frame.src === 'about:blank' || frame.src === location.href)){
      frame.src = GAL.embedUrl;
    }
  }
}

function openSkyGallery(url, title){
  if(url) GAL.embedUrl = url;
  var galBox = document.getElementById('skyGal');
  if(!galBox) return;
  galBox.style.display = 'flex';
  skyGalOpen = true;

  var extLink = document.getElementById('sgExternalLink');
  if(extLink) extLink.href = GAL.embedUrl;

  setSkyGalTab('gallery');

  if(!GAL.list.length){
    fetch('sky-gallery/index.json').then(function(r){ return r.json(); }).then(function(list){
      GAL.list = Array.isArray(list) ? list : [];
      GAL.i = 0;
      galShow();
    }).catch(function(){
      GAL.list = [];
      galShow();
    });
  } else {
    galShow();
  }
}

function closeSkyGallery(){
  var galBox = document.getElementById('skyGal');
  if(galBox) galBox.style.display = 'none';
  var frame = document.getElementById('sgFrame');
  if(frame) frame.src = 'about:blank';
  skyGalOpen = false;
}

// اتصال رویدادهای گالری رصدخانه
(function initSkyGal(){
  var closeBtn = document.getElementById('sgCloseBtn');
  if(closeBtn) closeBtn.onclick = closeSkyGallery;

  var tabGal = document.getElementById('sgTabGallery');
  var tabOn = document.getElementById('sgTabOnline');
  if(tabGal) tabGal.onclick = function(){ setSkyGalTab('gallery'); };
  if(tabOn) tabOn.onclick = function(){ setSkyGalTab('online'); };

  function prevImg(){
    if(GAL.list.length){
      GAL.i = (GAL.i - 1 + GAL.list.length) % GAL.list.length;
      galShow();
    }
  }
  function nextImg(){
    if(GAL.list.length){
      GAL.i = (GAL.i + 1) % GAL.list.length;
      galShow();
    }
  }

  var btnPrev = document.getElementById('sgBtnPrev');
  var btnNext = document.getElementById('sgBtnNext');
  var arrowPrev = document.getElementById('sgArrowPrev');
  var arrowNext = document.getElementById('sgArrowNext');
  if(btnPrev) btnPrev.onclick = prevImg;
  if(btnNext) btnNext.onclick = nextImg;
  if(arrowPrev) arrowPrev.onclick = prevImg;
  if(arrowNext) arrowNext.onclick = nextImg;

  var btnRot = document.getElementById('sgBtnRot');
  if(btnRot) btnRot.onclick = function(){ GAL.rot = (GAL.rot + 90) % 360; galShow(); };

  var btnFlipH = document.getElementById('sgBtnFlipH');
  if(btnFlipH) btnFlipH.onclick = function(){ GAL.fx = -GAL.fx; galShow(); };

  var btnFlipV = document.getElementById('sgBtnFlipV');
  if(btnFlipV) btnFlipV.onclick = function(){ GAL.fy = -GAL.fy; galShow(); };

  var btnZin = document.getElementById('sgBtnZin');
  if(btnZin) btnZin.onclick = function(){ GAL.z = Math.min(4, GAL.z * 1.25); galShow(); };

  var btnZout = document.getElementById('sgBtnZout');
  if(btnZout) btnZout.onclick = function(){ GAL.z = Math.max(0.5, GAL.z / 1.25); galShow(); };

  var btnReset = document.getElementById('sgBtnReset');
  if(btnReset) btnReset.onclick = function(){
    GAL.rot = 0; GAL.fx = 1; GAL.fy = 1; GAL.z = 1;
    galPreset('none');
  };

  var preNorm = document.getElementById('sgPreNorm');
  var preUV = document.getElementById('sgPreUV');
  var preGray = document.getElementById('sgPreGray');
  var preInv = document.getElementById('sgPreInv');
  if(preNorm) preNorm.onclick = function(){ galPreset('none'); };
  if(preUV) preUV.onclick = function(){ galPreset('uv'); };
  if(preGray) preGray.onclick = function(){ galPreset('gray'); };
  if(preInv) preInv.onclick = function(){ galPreset('inv'); };

  var slB = document.getElementById('sgSliderB');
  var slC = document.getElementById('sgSliderC');
  var slS = document.getElementById('sgSliderS');
  var slH = document.getElementById('sgSliderH');
  var slG = document.getElementById('sgSliderG');
  if(slB) slB.oninput = function(e){ GAL.b = +e.target.value; galShow(); };
  if(slC) slC.oninput = function(e){ GAL.c = +e.target.value; galShow(); };
  if(slS) slS.oninput = function(e){ GAL.s = +e.target.value; galShow(); };
  if(slH) slH.oninput = function(e){ GAL.h = +e.target.value; galShow(); };
  if(slG) slG.oninput = function(e){ GAL.g = +e.target.value; galShow(); };
})();

function selectRoom(id){
  var i=ROOMS.map(function(r){return r.id}).indexOf(id);
  if(i<0)i=0;
  curIdx=i; cur=ROOMS[i];
  z=1;dx=0;dy=0;applyT();
  render();
}
function step(d){selectRoom(ROOMS[(curIdx+d+ROOMS.length)%ROOMS.length].id)}

document.getElementById('nextBtn').onclick=function(){step(1)};
document.getElementById('prevBtn').onclick=function(){step(-1)};
document.getElementById('homeBtn').onclick=function(){selectRoom('konj')};
function goCatalog(){location.href='../index.html'}
document.getElementById('catBtn').onclick=goCatalog;
document.getElementById('closeBtn').onclick=goCatalog;

// ————— keyboard —————
document.addEventListener('keydown',function(e){
  if(skyGalOpen){
    if(e.key==='Escape'){closeSkyGallery();return;}
    if(e.key==='ArrowLeft'){if(GAL.list.length){GAL.i=(GAL.i+1)%GAL.list.length;galShow();}return;}
    if(e.key==='ArrowRight'){if(GAL.list.length){GAL.i=(GAL.i-1+GAL.list.length)%GAL.list.length;galShow();}return;}
    if(e.key==='+'||e.key==='='){GAL.z=Math.min(4,GAL.z*1.25);galShow();return;}
    if(e.key==='-'){GAL.z=Math.max(0.5,GAL.z/1.25);galShow();return;}
    if(e.key==='0'){GAL.z=1;galShow();return;}
    return;
  }
  if(e.key==='ArrowLeft')step(1);           // rtl: left = next
  else if(e.key==='ArrowRight')step(-1);
  else if(e.key==='Escape')goCatalog();
  else if(e.key==='+'||e.key==='=')setZoom(z*1.25);
  else if(e.key==='-')setZoom(z/1.25);
  else if(e.key==='e'||e.key==='E'){editing=!editing;document.body.classList.toggle('edit',editing);showToast(editing?'حالت ویرایش: نقاط را بکشید':'حالت نمایش')}
  else if(e.key==='c'||e.key==='C'){
    var txt=JSON.stringify(saved,null,1);
    if(navigator.clipboard)navigator.clipboard.writeText(txt);
    console.log(txt); showToast('JSON در کلیپ‌بورد/کنسول');
  }
  else if(e.key==='i'||e.key==='I'){
    // ورود مختصات از دستگاه دیگر (JSON کلید C)
    var raw=prompt('JSON مختصات را اینجا بچسبانید:');
    if(raw){ try{ var inc=JSON.parse(raw); Object.keys(inc).forEach(function(k){ saved[k]=inc[k]; }); var mv=migrateSaved(); localStorage.setItem(LS_KEY,JSON.stringify(saved)); drawHots(); showToast('وارد شد'+(mv?' ('+mv+' انتقال)':'')); }catch(err){ showToast('JSON نامعتبر است'); } }
  }
  else if(e.key==='r'||e.key==='R'){
    if(confirm('مختصات ذخیره‌شده پاک شود?')){saved={};localStorage.removeItem(LS_KEY);drawHots();showToast('بازگردانی شد')}
  }
});

// edit tools are keyboard-only: E=جابجایی، C=خروجی JSON، R=بازگردانی
render();applyT();
</script>
</body>
</html>
